---
layout: default
---

<div class="row g-5 mb-5">
  <div class="col-md-8">
    <h3 class="fw-bold">Welcome</h3>
    {{ content }}
  </div>
  <div class="col-md-4">
    <h3 class="fw-bold">Updates</h3>
    {% for post in site.posts %}
      <p class="mb-2"><a href="{{ post.url }}">{{ post.title }}</a><br><small class="text-muted">{{ post.date | date: "%B %-d, %Y" }}</small></p>
    {% endfor %}
  </div>
</div>
