---
layout: default
---

<div class="row g-5 mb-5">
  <div class="col-md-8">
    <h3 class="fw-bold">Welcome</h3>
    {{ content }}
  </div>
  <div class="col-md-4">
    <h3 class="fw-bold border-bottom pb-2 mb-3">Updates</h3>
    <div class="updates-list">
      {% for post in site.posts limit:5 %}
      <a href="{{ post.url }}" class="update-item">
        <span class="update-title">{{ post.title }}</span>
        <span class="update-date">{{ post.date | date: "%B %-d, %Y" }}</span>
      </a>
      {% endfor %}
    </div>
    <div class="text-end mt-2">
      <a href="/updates" class="updates-see-all">See all updates &rarr;</a>
    </div>
  </div>
</div>
