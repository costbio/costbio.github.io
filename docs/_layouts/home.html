---
layout: default
---

<div class="row g-5 mb-5">
  <div class="col-md-6">
    <h3 class="fw-bold">Welcome</h3>
    {{ content }}
  </div>
  <div class="col-md-6">
    <div class='viewer_3Dmoljs' data-pdb='1UXS'
      data-select1='all' data-style1='cartoon:color=spectrum' data-backgroundcolor='white'>
    </div>
  </div>
</div>

<div class="row g-5 mb-5">
  <div class="col-md-12">
    <h3 class="fw-bold border-bottom pb-3 mb-5">Updates</h3>
    {% for post in site.posts %}
      <p><a href="{{ post.url }}">{{ post.title }}</a> - {{ post.date | date: "%B %-d, %Y" }}</p>
    {% endfor %}
  </div>
</div>
