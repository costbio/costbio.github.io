---
layout: default
---

<div class="row g-5 mb-5">
  <div class="col-md-6">
    <h3 class="fw-bold">Welcome</h3>
    {{ content }}
  </div>
  <div class="col-md-6">
    <div class='viewer_3Dmoljs' style="height: 400px; width: 100%; position: relative;" data-pdb='8RBV' data-select1='all' data-style1='cartoon:color=spectrum' data-backgroundcolor='white'>
    </div>
    <div class="mt-4">
      <h3 class="fw-bold">Updates</h3>
      {% for post in site.posts %}
        <p class="mb-2"><a href="{{ post.url }}">{{ post.title }}</a><br><small class="text-muted">{{ post.date | date: "%B %-d, %Y" }}</small></p>
      {% endfor %}
    </div>
  </div>
</div>
