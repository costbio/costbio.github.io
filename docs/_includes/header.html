<header class="d-flex flex-column flex-md-row align-items-center pb-3 mb-5 border-bottom">
  <div class="text-center me-3">
        <a href="{{ site.github.url }}" class="d-block">
          <img src="{{ site.github.url }}/" alt="Logo" class="me-3", width="565px", height="100px" >
        </a>
        <a class="py-2 text-decoration-none" href="{{ site.github.url }}">{{ site.title }}</a>
  </div>
  <nav class="d-inline-flex mt-2 mt-md-0 ms-md-auto">
    {% for item in site.data.settings.menu %}
      <div class="text-center me-3">
        <a href="{{ item.url }}" class="d-block">
          <img src="{{ site.github.url }}/assets/images/{{ item.icon }}.png" alt="{{ item.name }}" width="100" height="100" class="mb-2">
        </a>
        <a class="py-2 text-decoration-none" href="{{ item.url }}">{{ item.name }}</a>
      </div>
    {% endfor %}
  </nav>
</header>
